<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    .rim   { fill: none; stroke: #1a1714; stroke-width: 6; }
    .spoke { stroke: #1a1714; stroke-width: 2.5; stroke-linecap: round; }
    .hub   { fill: #1a1714; }
    @media (prefers-color-scheme: dark) {
      .rim   { stroke: #f6f3ec; }
      .spoke { stroke: #f6f3ec; }
      .hub   { fill: #f6f3ec; }
    }
  </style>

  <!-- Spokes: hub edge (r=9) to rim (r=56), 8 evenly spaced -->
  <line class="spoke" x1="73"      y1="64"      x2="120"     y2="64"    />
  <line class="spoke" x1="70.36"   y1="57.64"   x2="103.60"  y2="24.40" />
  <line class="spoke" x1="64"      y1="55"      x2="64"      y2="8"     />
  <line class="spoke" x1="57.64"   y1="57.64"   x2="24.40"   y2="24.40" />
  <line class="spoke" x1="55"      y1="64"      x2="8"       y2="64"    />
  <line class="spoke" x1="57.64"   y1="70.36"   x2="24.40"   y2="103.60"/>
  <line class="spoke" x1="64"      y1="73"      x2="64"      y2="120"   />
  <line class="spoke" x1="70.36"   y1="70.36"   x2="103.60"  y2="103.60"/>

  <!-- Wheel rim -->
  <circle class="rim" cx="64" cy="64" r="56"/>

  <!-- Hub -->
  <circle class="hub" cx="64" cy="64" r="9"/>
</svg>
